name: ethiopian_reader
description: ፈለገ መጻሕፍት — Ethiopian religious books reader (Android, iOS, web, desktop).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  # Offline encryption-at-rest: AES-256-GCM via platform-native crypto.
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  go_router: ^14.6.2
  path_provider: ^2.1.4
  shared_preferences: ^2.5.4
  flutter_quill: ^11.5.1
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  google_fonts: ^6.2.1
  share_plus: ^12.0.2
  pdfrx: 2.2.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  # NOTE: assets/images/{bg1,slice,drawer-bg}.png are intentionally NOT bundled --
  # nothing references AppReferenceAssets, and they cost 1.3 MB in the web build.
  # Re-add the entry here if a screen starts using one.
  # logo-mark.png IS bundled (84 KB): AppLogoMark renders it in every brand lockup.
  # List it file-by-file rather than bundling assets/images/ wholesale.
  assets:
    - assets/images/logo-mark.png
  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic.ttf
