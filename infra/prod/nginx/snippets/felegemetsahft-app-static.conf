# Static-asset MIME fixes for app.felegemetsahft.com (the Flutter web bundle).
# Deployed to /etc/nginx/snippets/ and `include`d from the app server block by
# `scripts/deploy-prod.sh nginx`.
#
# Lives in a snippet rather than inline in the site file because the site file is
# rewritten in place by `certbot --nginx`; keeping these here means we can update
# them without touching (or risking) the certbot-managed TLS blocks.

# Flutter emits the licence blob extensionless, so it defaults to
# application/octet-stream and misses gzip_types. ~1.4 MB -> ~109 KB.
location = /assets/NOTICES {
    default_type text/plain;
}

# Not every nginx build ships a .ttf/.otf entry in mime.types; without one
# the font is application/octet-stream and skips gzip. 119 KB -> ~46 KB.
# (woff2 is already compressed -- listed only for correct typing.)
location ~* \.(ttf|otf)$ {
    default_type font/ttf;
}

# Same-origin APK (and sibling installers) so the Flutter web install prompt
# can stream the file with progress from app.felegemetsahft.com.
location /native-apps/ {
    alias /var/www/felegemetsahft/downloads/;
    autoindex off;
    add_header Cache-Control "public, max-age=3600";
    default_type application/octet-stream;
    types {
        application/vnd.android.package-archive apk;
    }
}

# Same-origin PDF byte proxy. The WASM reader needs synchronous Range requests,
# which browsers only allow same-origin — so we forward to the API instead of
# sending the browser cross-origin to MinIO.
location ~ "^/pdf-proxy/([0-9a-fA-F-]{36})$" {
    proxy_pass http://127.0.0.1:8000/v1/books/$1/pdf/bytes;
    proxy_http_version 1.1;
    proxy_set_header Host api.felegemetsahft.com;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
}
