# Compression tuning — deployed to /etc/nginx/conf.d/felegemetsahft-gzip.conf
# by `scripts/deploy-prod.sh nginx`.
#
# Ubuntu's stock nginx.conf enables gzip for text/html only (it ships `gzip on;`
# with every gzip_types/gzip_vary line commented out). The Flutter web bundle is
# dominated by main.dart.js (~5.0 MB raw, ~1.2 MB gzipped) plus assets/NOTICES,
# so compressing JS/JSON/fonts is the single largest page-weight win.
#
# NOTE: do NOT add `gzip on;` here. This file is included into the same `http`
# context as nginx.conf's own `gzip on;`, and nginx rejects the duplicate with
# `"gzip" directive is duplicate` — the whole config then fails to load.
#
# This is http-context, so it applies to every vhost on the box (including
# elearning.conf). That is intended: gzip_types lists only text-ish types, and
# already-compressed payloads (woff2, images, book files from MinIO) are excluded.

gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    application/javascript
    text/javascript
    application/json
    application/manifest+json
    application/wasm
    text/css
    text/plain
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;
