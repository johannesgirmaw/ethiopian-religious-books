# Nginx site for felegemetsahft.com.
#   felegemetsahft.com / www   -> Next.js landing (static) + /downloads/ artifacts
#   app.felegemetsahft.com     -> Flutter web app (static)
#   api.felegemetsahft.com     -> Django API (gunicorn)
#   files.felegemetsahft.com   -> MinIO (S3 presigned book/cover URLs)
# TLS is added in-place by `certbot --nginx`. This is the pre-cert (HTTP) form.

# ---- Compression (applies to every server block below) ----
# Ubuntu's stock nginx.conf enables gzip for text/html only. The Flutter web bundle
# is dominated by main.dart.js (~5.4 MB raw, ~1.45 MB gzipped) plus assets/NOTICES,
# so compressing JS/JSON/fonts is the single largest page-weight win.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    application/javascript
    text/javascript
    application/json
    application/manifest+json
    application/wasm
    text/css
    text/plain
    image/svg+xml
    font/ttf
    font/otf
    font/woff
    font/woff2;

# ---- Landing page (marketing / SEO) ----
server {
    listen 80;
    listen [::]:80;
    server_name felegemetsahft.com www.felegemetsahft.com;

    root /var/www/felegemetsahft/landing;
    index index.html;

    # App/desktop/mobile installers, served from a separate dir.
    location /downloads/ {
        alias /var/www/felegemetsahft/downloads/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
    }

    # Next.js static export: try exact file, then dir/index.html, then .html, else 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# ---- Flutter web app ----
server {
    listen 80;
    listen [::]:80;
    server_name app.felegemetsahft.com;

    root /var/www/felegemetsahft/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Never cache the service worker or bootstrap so new deploys propagate.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
    }

    # Flutter emits the licence blob extensionless, so it defaults to
    # application/octet-stream and misses gzip_types. ~1.4 MB -> ~109 KB.
    location = /assets/NOTICES {
        default_type text/plain;
    }

    # Not every nginx build ships a .ttf/.otf entry in mime.types; without one
    # the font is application/octet-stream and skips gzip. 119 KB -> ~46 KB.
    # (woff2 is already compressed -- listed only for correct typing.)
    location ~* \.(ttf|otf)$ {
        default_type font/ttf;
    }
}

# ---- Django API ----
server {
    listen 80;
    listen [::]:80;
    server_name api.felegemetsahft.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---- MinIO (S3) — serves presigned book/cover URLs ----
server {
    listen 80;
    listen [::]:80;
    server_name files.felegemetsahft.com;

    client_max_body_size 512m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }
}
