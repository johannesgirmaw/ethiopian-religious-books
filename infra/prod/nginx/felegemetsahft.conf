# Nginx site for felegemetsahft.com — web (static) + API + object storage.
# TLS is added in-place by `certbot --nginx`. This file is the pre-cert (HTTP) form.

# ---- Web app (Flutter web build) ----
server {
    listen 80;
    listen [::]:80;
    server_name felegemetsahft.com www.felegemetsahft.com;

    root /var/www/felegemetsahft/web;
    index index.html;

    # Flutter web: SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets; never cache the shell.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# ---- Django API ----
server {
    listen 80;
    listen [::]:80;
    server_name api.felegemetsahft.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---- MinIO (S3) — serves presigned book/cover URLs ----
server {
    listen 80;
    listen [::]:80;
    server_name files.felegemetsahft.com;

    # Book uploads can be large; allow big bodies and disable request buffering.
    client_max_body_size 512m;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }
}
